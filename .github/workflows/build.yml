name: Build image

on:
  # Run all PRs so required validation checks are never skipped by path filters.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - Dockerfile
      - default/**
      - .dockerignore
      - .github/**
      - compose*.yml
      - .env.example
  workflow_dispatch:

permissions:
  contents: read

# PRs must not cancel or replace pending main publications.
concurrency:
  group: validate-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate Compose
        run: docker compose config --quiet
      - name: Test release policy
        run: |
          bash -n .github/scripts/publish.sh .github/tests/publish-test.sh
          shellcheck .github/scripts/publish.sh .github/tests/publish-test.sh
          bash .github/tests/publish-test.sh

  build:
    strategy:
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build
        run: docker build -t caddy-cloudflare-redis:ci .

      - name: Check plugins
        run: |
          modules=$(docker run --rm caddy-cloudflare-redis:ci caddy list-modules --skip-standard)
          echo "$modules"
          grep -q '^caddy.storage.redis' <<<"$modules"
          grep -q '^dns.providers.cloudflare' <<<"$modules"

      - name: Check quic-go is not downgraded
        run: |
          info=$(docker run --rm caddy-cloudflare-redis:ci caddy build-info)
          required=$(awk '$1 == "dep" && $2 == "github.com/quic-go/quic-go" { print $3 }' <<<"$info")
          used=$(awk '$1 == "=>" && $2 == "github.com/quic-go/quic-go" { print $3 }' <<<"$info")
          echo "Caddy requires $required, build uses ${used:-$required}"
          if [ -n "$used" ] && [ "$(printf '%s\n' "$required" "$used" | sort -V | tail -1)" != "$used" ]; then
            echo "::error::--replace downgrades quic-go. Remove it from the Dockerfile."
            exit 1
          fi

      - name: Serve the default page on new volumes as each supported user
        run: |
          for ids in 65532:65532 99:100; do
            docker run -d --name smoke --user "$ids" --read-only \
              --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp \
              -v smoke-config:/config -v smoke-data:/data \
              caddy-cloudflare-redis:ci
            ok=
            for _ in $(seq 1 15); do
              if docker exec smoke curl -fsS http://127.0.0.1/ | grep -q 'Caddy is running'; then ok=1; break; fi
              sleep 1
            done
            logs=$(docker logs smoke 2>&1)
            echo "$logs"
            docker rm -f smoke
            docker volume rm smoke-config smoke-data
            [ -n "$ok" ]
            if grep -q 'permission denied' <<<"$logs"; then
              echo "::error::Caddy can't write to its volumes as $ids"
              exit 1
            fi
          done

      # No registry login or package-write permission in build/PR jobs.
      - name: Save tested image
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        env:
          ARCH: ${{ matrix.arch }}
        run: docker save caddy-cloudflare-redis:ci -o "$RUNNER_TEMP/image-$ARCH.tar"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        with:
          name: image-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/image-${{ matrix.arch }}.tar
          if-no-files-found: error
          retention-days: 2
          compression-level: 0

  publish:
    needs: [checks, build]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    # Serialize every publisher, including the legacy workflow's "build" group.
    # Serialization is not a freshness guarantee; publish.sh checks remote main.
    concurrency:
      group: build
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-${{ github.run_id }}-${{ github.run_attempt }}-*
          path: ${{ runner.temp }}/images
          merge-multiple: true

      - name: Log in to GHCR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$GITHUB_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin

      - name: Publish attempt tags and conditionally promote latest
        env:
          IMAGE_DIR: ${{ runner.temp }}/images
        run: bash .github/scripts/publish.sh

      - name: Log out of GHCR
        if: always()
        run: docker logout ghcr.io
