# Caddy with Cloudflare DNS challenges and certificate storage in Valkey.
# Your applications join the shared external "caddy" network; see README.md.
services:
  caddy:
    image: ghcr.io/baujahr/caddy-cloudflare-redis:latest
    restart: unless-stopped
    ports:
      - "80:80/tcp"
      - "443:443/tcp"
      - "443:443/udp"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    environment:
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:?Set CLOUDFLARE_API_TOKEN in .env}
      VALKEY_PASSWORD: ${VALKEY_PASSWORD:?Set VALKEY_PASSWORD in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-config:/config
      - caddy-data:/data
    networks:
      - caddy
      - storage
    depends_on:
      valkey:
        condition: service_healthy

  valkey:
    image: valkey/valkey:9-alpine
    restart: unless-stopped
    command:
      - valkey-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${VALKEY_PASSWORD:?Set VALKEY_PASSWORD in .env}
    environment:
      VALKEYCLI_AUTH: ${VALKEY_PASSWORD:?Set VALKEY_PASSWORD in .env}
    volumes:
      - valkey-data:/data
    networks:
      - storage
    healthcheck:
      test: ["CMD-SHELL", "valkey-cli ping | grep -q PONG"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

networks:
  # Shared with your application containers. Create it once with:
  #   docker network create caddy
  caddy:
    external: true
  # Private network between Caddy and Valkey only, with no outside access.
  storage:
    internal: true

volumes:
  caddy-config:
  caddy-data:
  valkey-data:
